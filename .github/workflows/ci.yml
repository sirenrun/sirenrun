name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_DNA: "1"

jobs:
  program:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            target
            tests/magicsvm/target
          key: program-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Anchor.toml', 'tests/magicsvm/Cargo.lock') }}

      - name: Install Solana 4.1.2
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.1.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor 1.2.2
        run: |
          curl -sSfL -o anchor https://github.com/solana-foundation/anchor/releases/download/v1.2.2/anchor-1.2.2-x86_64-unknown-linux-gnu
          sudo install -m 755 anchor /usr/local/bin/anchor

      - run: anchor build
      - name: SDK IDL copy matches the build
        run: |
          diff -u target/idl/sirenrun.json packages/sdk/src/idl/sirenrun.json
          diff -u target/types/sirenrun.ts packages/sdk/src/idl/sirenrun.ts
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p sirenrun --all-targets -- -D warnings
      - run: cargo test -p sirenrun

      - name: MagicSVM integration tests
        working-directory: tests/magicsvm
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @sirenrun/app build
